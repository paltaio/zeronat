[package]
name = "zeronat-installer"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "zeronat-installer"
path = "src/main.rs"

[dependencies]
zntui = { path = "../tui" }
zeronat-install-support = { path = "../install-support" }
zeronat-secret = { path = "../secret" }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
