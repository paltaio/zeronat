[package]
name = "zeronat-install-support"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
ed25519-dalek = { version = "2", default-features = false }
sha2 = { version = "0.10", default-features = false, features = ["std", "force-soft"] }
zeronat-secret = { path = "../secret" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
