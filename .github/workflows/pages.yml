name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "get.sh"
      - "crates/installer/**"
      - "crates/tui/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The deploy waits for the release named by Cargo.toml, so a pushed get.sh
  # or installer never goes live ahead of the release it installs. The
  # release workflow calls this workflow after publishing.
  release-exists:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if gh release view "$version" --json tagName --jq .tagName; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "release $version is not published; deploying nothing"
          fi

  installers:
    needs: release-exists
    if: needs.release-exists.outputs.exists == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - arm-unknown-linux-musleabihf
          - mips-unknown-linux-gnu
          - mipsel-unknown-linux-gnu
          - mips64-unknown-linux-gnuabi64
          - mips64el-unknown-linux-gnuabi64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
          components: rust-src

      - name: Install cross
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2
        with:
          tool: cross

      - name: Require the release public key
        env:
          ZERONAT_RELEASE_PUBKEY: ${{ vars.ZERONAT_RELEASE_PUBKEY }}
        run: |
          printf '%s' "$ZERONAT_RELEASE_PUBKEY" | grep -Eq '^[0-9a-f]{64}$' || { echo "ZERONAT_RELEASE_PUBKEY is not a 64-hex ed25519 public key; an installer built without it cannot verify downloads"; exit 1; }

      - name: Build installer
        env:
          RUSTFLAGS: '-Zlocation-detail=none -Zfmt-debug=none -Zunstable-options -Cpanic=immediate-abort -Cforce-unwind-tables=no'
          ZERONAT_RELEASE_PUBKEY: ${{ vars.ZERONAT_RELEASE_PUBKEY }}
        run: |
          cross build --release --locked \
            -Zbuild-std=std,panic_abort -Zbuild-std-features=optimize_for_size \
            --target ${{ matrix.target }} -p zeronat-installer

      - name: Stage installer
        run: install -D "target/${{ matrix.target }}/release/zeronat-installer" "out/zeronat-installer-${{ matrix.target }}"

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-${{ matrix.target }}
          path: out/zeronat-installer-${{ matrix.target }}
          if-no-files-found: error

  deploy:
    needs: installers
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: installer-*

      - name: Stage site
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp get.sh _site/get.sh
          for d in artifacts/installer-*; do
            cp "$d"/zeronat-installer-* _site/
          done
          (cd _site && sha256sum zeronat-installer-* > SHA256SUMS)
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
