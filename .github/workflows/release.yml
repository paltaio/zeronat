name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  # A workflow_dispatch run is a release rehearsal: it builds and signs
  # against a keypair generated for the run and publishes nothing - no
  # release, no tag, no image. The seed is readable in this job's outputs by
  # anyone who can see the run; it must only ever sign the run's unpublished
  # artifacts.
  throwaway-key:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      pubkey: ${{ steps.gen.outputs.pubkey }}
      seed: ${{ steps.gen.outputs.seed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Generate the run's keypair
        id: gen
        run: |
          seed=$(openssl rand -hex 32)
          pubkey=$(ZERONAT_RELEASE_SIGNING_KEY="$seed" cargo run --locked -p zeronat-install-support --bin sign-release -- --pubkey)
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "pubkey=$pubkey" >> "$GITHUB_OUTPUT"

  binaries:
    needs: throwaway-key
    # Tag builds run with the throwaway-key job skipped; a dry run needs it.
    if: ${{ !cancelled() && (needs.throwaway-key.result == 'success' || needs.throwaway-key.result == 'skipped') }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - arm-unknown-linux-gnueabihf
          - arm-unknown-linux-musleabihf
          - armv7-unknown-linux-gnueabihf
          - armv7-unknown-linux-musleabihf
          # mips (tier 3, built from source via build-std)
          - mips-unknown-linux-gnu
          - mipsel-unknown-linux-gnu
          - mips64-unknown-linux-gnuabi64
          - mips64el-unknown-linux-gnuabi64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
          components: rust-src

      - name: Install cross
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2
        with:
          tool: cross

      - name: Guard getrandom on 0.2.x (MIPS build needs it)
        run: |
          v=$(cargo tree -i getrandom 2>/dev/null | head -1)
          echo "$v"
          echo "$v" | grep -q 'getrandom v0\.2\.' || { echo "getrandom drifted off 0.2.x; MIPS build will break"; exit 1; }

      - name: Require a release public key
        env:
          ZERONAT_RELEASE_PUBKEY: ${{ startsWith(github.ref, 'refs/tags/') && vars.ZERONAT_RELEASE_PUBKEY || needs.throwaway-key.outputs.pubkey }}
        run: |
          printf '%s' "$ZERONAT_RELEASE_PUBKEY" | grep -Eq '^[0-9a-f]{64}$' || { echo "ZERONAT_RELEASE_PUBKEY is not a 64-hex ed25519 public key; a release binary built without it cannot verify upgrades"; exit 1; }

      - name: Build
        env:
          RUSTFLAGS: '-Zlocation-detail=none -Zfmt-debug=none -Zunstable-options -Cpanic=immediate-abort -Cforce-unwind-tables=no --cfg curve25519_dalek_backend="serial"'
          # Static non-PIE link through rustc's bundled lld, with identical
          # code folding; the cross images ship no lld of their own.
          MUSL_RUSTFLAGS: '-Crelocation-model=static -Ctarget-feature=+crt-static -Clinker-features=+lld -Clink-self-contained=+linker -Clink-arg=-Wl,--icf=all -Clink-arg=-Wl,--build-id=none -Clink-arg=-Wl,-z,noseparate-code -Clink-arg=-Wl,--no-eh-frame-hdr -Clink-arg=-Wl,-O2'
          ZERONAT_RELEASE_PUBKEY: ${{ startsWith(github.ref, 'refs/tags/') && vars.ZERONAT_RELEASE_PUBKEY || needs.throwaway-key.outputs.pubkey }}
        run: |
          case "${{ matrix.target }}" in
            *-musl*) RUSTFLAGS="$RUSTFLAGS $MUSL_RUSTFLAGS" ;;
          esac
          if [ "${{ matrix.target }}" = armv7-unknown-linux-musleabihf ]; then
            RUSTFLAGS="$RUSTFLAGS -Ctarget-feature=+thumb-mode"
          fi
          export RUSTFLAGS
          cross build --release --locked \
            -Zbuild-std=std,panic_abort -Zbuild-std-features=optimize_for_size \
            --target ${{ matrix.target }}

      - name: Package
        run: install -D "target/${{ matrix.target }}/release/zeronat" "out/zeronat"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bin-${{ matrix.target }}
          path: out/zeronat
          if-no-files-found: error

  freebsd:
    needs: throwaway-key
    # Tag builds run with the throwaway-key job skipped; a dry run needs it.
    if: ${{ !cancelled() && (needs.throwaway-key.result == 'success' || needs.throwaway-key.result == 'skipped') }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-freebsd
          - aarch64-unknown-freebsd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
          components: rust-src

      # zig 0.16 ships the FreeBSD system-library stubs (execinfo, kvm, ...) that
      # std links; older zig fails to find them at link time.
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2
        with:
          tool: cargo-zigbuild

      - name: Require a release public key
        env:
          ZERONAT_RELEASE_PUBKEY: ${{ startsWith(github.ref, 'refs/tags/') && vars.ZERONAT_RELEASE_PUBKEY || needs.throwaway-key.outputs.pubkey }}
        run: |
          printf '%s' "$ZERONAT_RELEASE_PUBKEY" | grep -Eq '^[0-9a-f]{64}$' || { echo "ZERONAT_RELEASE_PUBKEY is not a 64-hex ed25519 public key; a release binary built without it cannot verify upgrades"; exit 1; }

      - name: Build
        env:
          RUSTFLAGS: '-Zlocation-detail=none -Zfmt-debug=none -Zunstable-options -Cpanic=immediate-abort -Cforce-unwind-tables=no --cfg curve25519_dalek_backend="serial"'
          ZERONAT_RELEASE_PUBKEY: ${{ startsWith(github.ref, 'refs/tags/') && vars.ZERONAT_RELEASE_PUBKEY || needs.throwaway-key.outputs.pubkey }}
        run: |
          cargo zigbuild --release --locked \
            -Zbuild-std=std,panic_abort -Zbuild-std-features=optimize_for_size \
            --target ${{ matrix.target }}

      - name: Package
        run: install -D "target/${{ matrix.target }}/release/zeronat" "out/zeronat"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bin-${{ matrix.target }}
          path: out/zeronat
          if-no-files-found: error

  windows:
    # Temporarily disabled. Re-enable: drop `if: false` and add `windows` back to release.needs.
    if: false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
          components: rust-src

      - name: Install clang and lld
        run: sudo apt-get update && sudo apt-get install -y clang llvm lld

      - name: Install cargo-xwin
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2
        with:
          tool: cargo-xwin

      # Windows requires unwind tables, so -Cforce-unwind-tables=no is omitted here.
      - name: Build
        env:
          XWIN_ACCEPT_LICENSE: "1"
          RUSTFLAGS: '-Zlocation-detail=none -Zfmt-debug=none -Zunstable-options -Cpanic=immediate-abort --cfg curve25519_dalek_backend="serial"'
        run: |
          cargo xwin build --release --locked \
            -Zbuild-std=std,panic_abort -Zbuild-std-features=optimize_for_size \
            --target ${{ matrix.target }}

      - name: Package
        run: install -D "target/${{ matrix.target }}/release/zeronat.exe" "out/zeronat.exe"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bin-${{ matrix.target }}
          path: out/zeronat.exe
          if-no-files-found: error

  release:
    needs: [binaries, freebsd]
    # throwaway-key is skipped on a tag, and that skip propagates down the needs
    # graph: without an explicit result check this job is skipped too, even
    # though every job it needs succeeded.
    if: ${{ !cancelled() && needs.binaries.result == 'success' && needs.freebsd.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check the tag against the workspace version
        # The manifest is named from the tag while the binaries report
        # CARGO_PKG_VERSION; a mismatch ships an upgrade that never settles.
        run: |
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\(.*\)"$/\1/p;}' Cargo.toml)"
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME does not match the workspace version $version"; exit 1; }
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: bin-*
      - name: Collect per-target binaries
        run: |
          mkdir -p out
          for d in artifacts/bin-*; do
            name="${d#artifacts/bin-}"
            if [ -f "$d/zeronat.exe" ]; then
              install -m 0755 "$d/zeronat.exe" "out/zeronat-${name}.exe"
            else
              install -m 0755 "$d/zeronat" "out/zeronat-${name}"
            fi
          done
      - name: Write and sign the release manifest
        env:
          LC_ALL: C
          ZERONAT_RELEASE_SIGNING_KEY: ${{ secrets.ZERONAT_RELEASE_SIGNING_KEY }}
        run: |
          {
            printf 'zeronat-release-v1 %s\n' "$GITHUB_REF_NAME"
            for f in out/zeronat-*; do
              digest=$(sha256sum "$f")
              printf '%s %s %s\n' "${digest%% *}" "$(wc -c < "$f" | tr -d ' ')" "${f#out/}"
            done
          } > release.manifest
          cargo run --locked -p zeronat-install-support --bin sign-release \
            < release.manifest > release.manifest.sig
          mv release.manifest release.manifest.sig out/
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            out/zeronat-*
            out/release.manifest
            out/release.manifest.sig

  # Runs the release job's collect-and-sign steps with the run's throwaway
  # key and publishes nothing.
  dry-release:
    needs: [throwaway-key, binaries, freebsd]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: bin-*
      - name: Collect per-target binaries
        run: |
          mkdir -p out
          for d in artifacts/bin-*; do
            name="${d#artifacts/bin-}"
            if [ -f "$d/zeronat.exe" ]; then
              install -m 0755 "$d/zeronat.exe" "out/zeronat-${name}.exe"
            else
              install -m 0755 "$d/zeronat" "out/zeronat-${name}"
            fi
          done
      - name: Write and sign the release manifest
        env:
          LC_ALL: C
          ZERONAT_RELEASE_SIGNING_KEY: ${{ needs.throwaway-key.outputs.seed }}
        run: |
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\(.*\)"$/\1/p;}' Cargo.toml)"
          [ -n "$version" ] || { echo "Cargo.toml has no version under [workspace.package]"; exit 1; }
          version="v$version"
          {
            printf 'zeronat-release-v1 %s\n' "$version"
            for f in out/zeronat-*; do
              digest=$(sha256sum "$f")
              printf '%s %s %s\n' "${digest%% *}" "$(wc -c < "$f" | tr -d ' ')" "${f#out/}"
            done
          } > release.manifest
          cargo run --locked -p zeronat-install-support --bin sign-release \
            < release.manifest > release.manifest.sig
      - name: Upload the rehearsal manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dry-release-manifest
          path: |
            release.manifest
            release.manifest.sig
          if-no-files-found: error

  # get.sh and the installers go live only after the release they install is
  # published.
  pages:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
    uses: ./.github/workflows/pages.yml

  docker:
    needs: [binaries, release]
    # On a tag the image publishes only after the release exists; a dry run
    # builds the image with the release job skipped and pushes nothing.
    if: ${{ !cancelled() && needs.binaries.result == 'success' && (needs.release.result == 'success' || (needs.release.result == 'skipped' && !startsWith(github.ref, 'refs/tags/'))) }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Docker platform -> static musl target.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: bin-x86_64-unknown-linux-musl, path: dist/linux/amd64 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: bin-aarch64-unknown-linux-musl, path: dist/linux/arm64 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: bin-armv7-unknown-linux-musleabihf, path: dist/linux/arm/v7 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: bin-arm-unknown-linux-musleabihf, path: dist/linux/arm/v6 }

      - name: Mark binaries executable
        run: find dist -name zeronat -exec chmod +x {} +

      # The base-image package install runs under emulation for the arm variants.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/zeronat
          # latest moves with release tags.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
          flavor: |
            latest=auto

      - name: Build, pushing only for a tag
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # znpppoe links the zeronat crate from this tree, so its image ships under
  # the same version.
  znpppoe:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/znpppoe.yml
    with:
      tag: ${{ github.ref_name }}
