name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  binaries:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - arm-unknown-linux-gnueabihf
          - arm-unknown-linux-musleabihf
          - armv7-unknown-linux-gnueabihf
          - armv7-unknown-linux-musleabihf
          # mips (tier 3, built from source via build-std)
          - mips-unknown-linux-gnu
          - mipsel-unknown-linux-gnu
          - mips64-unknown-linux-gnuabi64
          - mips64el-unknown-linux-gnuabi64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
          components: rust-src

      - name: Install cross
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2
        with:
          tool: cross

      - name: Guard getrandom on 0.2.x (MIPS build needs it)
        run: |
          v=$(cargo tree -i getrandom 2>/dev/null | head -1)
          echo "$v"
          echo "$v" | grep -q 'getrandom v0\.2\.' || { echo "getrandom drifted off 0.2.x; MIPS build will break"; exit 1; }

      - name: Build
        env:
          RUSTFLAGS: '-Zlocation-detail=none -Zfmt-debug=none -Zunstable-options -Cpanic=immediate-abort -Cforce-unwind-tables=no --cfg curve25519_dalek_backend="serial"'
        run: |
          cross build --release --locked \
            -Zbuild-std=std,panic_abort -Zbuild-std-features=optimize_for_size \
            --target ${{ matrix.target }}

      - name: Package
        run: install -D "target/${{ matrix.target }}/release/zeronat" "out/zeronat"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bin-${{ matrix.target }}
          path: out/zeronat
          if-no-files-found: error

  freebsd:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-freebsd
          - aarch64-unknown-freebsd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
          components: rust-src

      # zig 0.16 ships the FreeBSD system-library stubs (execinfo, kvm, ...) that
      # std links; older zig fails to find them at link time.
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2
        with:
          tool: cargo-zigbuild

      - name: Build
        env:
          RUSTFLAGS: '-Zlocation-detail=none -Zfmt-debug=none -Zunstable-options -Cpanic=immediate-abort -Cforce-unwind-tables=no --cfg curve25519_dalek_backend="serial"'
        run: |
          cargo zigbuild --release --locked \
            -Zbuild-std=std,panic_abort -Zbuild-std-features=optimize_for_size \
            --target ${{ matrix.target }}

      - name: Package
        run: install -D "target/${{ matrix.target }}/release/zeronat" "out/zeronat"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bin-${{ matrix.target }}
          path: out/zeronat
          if-no-files-found: error

  installers:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - arm-unknown-linux-musleabihf
          - mips-unknown-linux-gnu
          - mipsel-unknown-linux-gnu
          - mips64-unknown-linux-gnuabi64
          - mips64el-unknown-linux-gnuabi64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
          components: rust-src

      - name: Install cross
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2
        with:
          tool: cross

      - name: Build installer
        env:
          RUSTFLAGS: '-Zlocation-detail=none -Zfmt-debug=none -Zunstable-options -Cpanic=immediate-abort -Cforce-unwind-tables=no'
        run: |
          cross build --release --locked \
            -Zbuild-std=std,panic_abort -Zbuild-std-features=optimize_for_size \
            --target ${{ matrix.target }} -p zeronat-installer

      - name: Stage installer
        run: install -D "target/${{ matrix.target }}/release/zeronat-installer" "out/zeronat-installer-${{ matrix.target }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-${{ matrix.target }}
          path: out/zeronat-installer-${{ matrix.target }}
          if-no-files-found: error

  release-preflight:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "paltaio/zeronat"
          tag=${GITHUB_REF#refs/tags/}
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version=${tag#v}
          package_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "zeronat") | .version')
          test "$version" = "$package_version"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists" >&2
            exit 1
          fi

  release:
    needs: [binaries, freebsd, installers, docker]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: release-signing
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: bin-*

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: installer-*

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image-reference
          path: out

      - name: Collect per-target binaries
        run: |
          mkdir -p out
          for d in artifacts/bin-*; do
            name="${d#artifacts/bin-}"
            install -m 0755 "$d/zeronat" "out/zeronat-v6-${name}"
          done
          for d in artifacts/installer-*; do
            install -m 0755 "$d"/zeronat-installer-* out/
          done
          install -m 0644 compose.yml compose.bridge.yml out/

      - name: Validate release identity and inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=${GITHUB_REF#refs/tags/}
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version=${tag#v}
          package_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "zeronat") | .version')
          test "$version" = "$package_version"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists" >&2
            exit 1
          fi
          test "$(find out -maxdepth 1 -type f -name 'zeronat-v6-*' | wc -l)" -eq 14
          test "$(find out -maxdepth 1 -type f -name 'zeronat-installer-*' | wc -l)" -eq 8
          grep -Eq '^ghcr\.io/paltaio/zeronat@sha256:[0-9a-f]{64}$' out/zeronat-image-v6.txt
          test "$(wc -l < out/zeronat-image-v6.txt)" -eq 1

      - name: Install Minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Sign release manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          umask 077
          tag=${GITHUB_REF#refs/tags/}
          key_id=85ba020a1bd957f1
          manifest="out/zeronat-release-v1-$tag.manifest"
          signature="$manifest.$key_id.minisig"
          key=$(mktemp)
          derived=$(mktemp)
          trap 'rm -f "$key" "$derived"' EXIT
          derived_id=$(python3 - <<'PY'
          import base64
          from pathlib import Path

          payload = base64.b64decode(Path("release/minisign.pub").read_text().splitlines()[1], validate=True)
          if len(payload) != 42:
              raise SystemExit("invalid Minisign public key")
          print(f"{int.from_bytes(payload[2:10], 'little'):016x}")
          PY
          )
          test "$derived_id" = "$key_id"
          printf '%s' "$MINISIGN_SECRET_KEY" > "$key"
          minisign -R -s "$key" -p "$derived"
          test "$(sed -n '2p' "$derived")" = "$(sed -n '2p' release/minisign.pub)"
          {
            printf 'zeronat-release-v1 %s\n' "$tag"
            for asset in out/compose.yml out/compose.bridge.yml out/zeronat-image-v6.txt out/zeronat-v6-* out/zeronat-installer-*; do
              printf '%s %s %s\n' \
                "$(sha256sum "$asset" | awk '{print $1}')" \
                "$(stat -c '%s' "$asset")" \
                "$(basename "$asset")"
            done | LC_ALL=C sort -k3,3
          } > "$manifest"
          minisign -S -s "$key" -m "$manifest" -x "$signature" -t "zeronat $tag release manifest"
          minisign -V -H -q -p release/minisign.pub -m "$manifest" -x "$signature"
          rm -f "$key" "$derived"
          trap - EXIT

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=${GITHUB_REF#refs/tags/}
          manifest="out/zeronat-release-v1-$tag.manifest"
          signature="$manifest.85ba020a1bd957f1.minisig"
          release_assets=(out/compose.yml out/compose.bridge.yml out/zeronat-image-v6.txt out/zeronat-v6-* out/zeronat-installer-* "$manifest" "$signature")
          test "${#release_assets[@]}" -eq 27
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          gh release create "$tag" --draft --verify-tag --title "$tag" "${release_assets[@]}"

          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$tag" --dir "$verify_dir"
          test "${#release_assets[@]}" -eq "$(find "$verify_dir" -maxdepth 1 -type f | wc -l)"
          for local_asset in "${release_assets[@]}"; do
            remote_asset="$verify_dir/$(basename "$local_asset")"
            test -f "$remote_asset"
            test "$(stat -c '%s' "$local_asset")" = "$(stat -c '%s' "$remote_asset")"
            test "$(sha256sum "$local_asset" | awk '{print $1}')" = "$(sha256sum "$remote_asset" | awk '{print $1}')"
          done

          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          gh release edit "$tag" --draft=false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.immutable')" = true

  docker:
    needs: [binaries, release-preflight]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Revalidate protected release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "paltaio/zeronat"
          tag=${GITHUB_REF#refs/tags/}
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version=${tag#v}
          package_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "zeronat") | .version')
          test "$version" = "$package_version"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists" >&2
            exit 1
          fi

      # Docker platform -> static musl target.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: bin-x86_64-unknown-linux-musl, path: dist/linux/amd64 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: bin-aarch64-unknown-linux-musl, path: dist/linux/arm64 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: bin-armv7-unknown-linux-musleabihf, path: dist/linux/arm/v7 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: bin-arm-unknown-linux-musleabihf, path: dist/linux/arm/v6 }

      - name: Mark binaries executable
        run: find dist -name zeronat -exec chmod +x {} +

      # The base-image package install runs under emulation for the arm variants.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/zeronat
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=protocol-v6

      - name: Build and push
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Record release image digest
        run: |
          set -euo pipefail
          digest='${{ steps.image.outputs.digest }}'
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'ghcr.io/paltaio/zeronat@%s\n' "$digest" > zeronat-image-v6.txt

      - name: Upload release image reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-reference
          path: zeronat-image-v6.txt
          if-no-files-found: error
