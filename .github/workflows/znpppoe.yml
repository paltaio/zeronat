name: znpppoe-image

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  push:
    branches: [main]
    paths:
      - "crates/znpppoe/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/znpppoe.yml"

permissions: {}

env:
  IMAGE: ghcr.io/paltaio/znpppoe

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: crates/znpppoe/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=znpppoe-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=znpppoe-${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    permissions:
      packages: write
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest
        # A release tag moves the version tags and latest; a main push moves
        # only edge.
        working-directory: /tmp/digests
        run: |
          version="${TAG#v}"
          if [ -n "$version" ]; then
            tags=(-t "$IMAGE:$version" -t "$IMAGE:${version%.*}" -t "$IMAGE:latest")
          else
            tags=(-t "$IMAGE:edge")
          fi
          docker buildx imagetools create "${tags[@]}" \
            $(for d in *; do echo "$IMAGE@sha256:$d"; done)
      - name: Inspect manifest
        run: |
          version="${TAG#v}"
          docker buildx imagetools inspect "$IMAGE:${version:-edge}"
