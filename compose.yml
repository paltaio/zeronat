services:
  zeronat:
    image: ${ZERONAT_IMAGE:?set ZERONAT_IMAGE to an image digest reference}
    container_name: zeronat
    network_mode: host
    restart: unless-stopped
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: .env
    volumes:
      - /etc/zeronat/data:/etc/zeronat/data
    command: ${ZERONAT_ARGS}
